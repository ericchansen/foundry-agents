# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: source-code-hosted-agent-example

services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}

  source-code-agent:
    host: azure.ai.agent
    project: ./agent
    uses:
      - ai-project
    kind: hosted
    name: source-code-hosted-agent-lab
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

infra:
  provider: bicep
  path: ../../infra
  module: main
